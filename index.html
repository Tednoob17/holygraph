<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HolyGraph - Project Visualization</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>HolyGraph</h1>
            <p>Visualize your projects in graph form</p>
        </header>

        <div class="input-section">
            <h2>Enter Your Information</h2>
            <form id="user-form">
                <div class="form-group">
                    <label for="username">Username/Login:</label>
                    <input type="text" id="username" name="username" placeholder="e.g., nadoho" required>
                </div>

                <div class="form-group">
                    <label for="cursus_id">Cursus ID:</label>
                    <input type="text" id="cursus_id" name="cursus_id" placeholder="e.g., 21" required>
                </div>

                <div class="form-group">
                    <label for="campus_id">Campus ID:</label>
                    <input type="text" id="campus_id" name="campus_id" placeholder="e.g., 1" required>
                </div>

                <div class="form-group">
                    <label for="api_url">API URL (optional):</label>
                    <input type="url" id="api_url" name="api_url" placeholder="https://projects.intra.42.fr/project_data.json" value="https://projects.intra.42.fr/project_data.json">
                </div>

                <button type="submit" class="btn-primary">Generate Graph</button>
            </form>
        </div>

        <div class="graph-section" id="graph-section" style="display: none;">
            <h2>Your Project Graph</h2>
            <div class="graph-info">
                <p><strong>User:</strong> <span id="display-username"></span></p>
                <p><strong>Cursus ID:</strong> <span id="display-cursus"></span></p>
                <p><strong>Campus ID:</strong> <span id="display-campus"></span></p>
                <p><strong>Fetch URL:</strong> <span id="display-url"></span></p>
            </div>
            <canvas class="graph-canvas" id="view" resize="" style="user-select: none;" width="1550" height="600"></canvas>
            <button class="btn-secondary" id="reset-btn">Enter New Information</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
